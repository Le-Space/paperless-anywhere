name: Paperless rootfs

# Builds the Paperless rootfs (rootfs/build-image.sh), makes it confidential
# and encrypts it with relay-button's aleph-confidential-rootfs action, and
# publishes it as an Aleph STORE (paid in credits by ALEPH_PRIVATE_KEY).
# The STORE hash in the summary is what an instance boots from.
#
# Every image a person uses has a passphrase of its own:
# - purpose "release": the job makes a random passphrase, runs on a
#   GitHub-hosted runner only, and prints the passphrase encrypted with age to
#   the recipient in the repository variable IMAGE_KEY_RECIPIENT (age1…). Only
#   the holder of that age identity can read it; it is no GitHub secret and no
#   test ever gets it.
# - purpose "test": the passphrase is the secret PAPERLESS_LUKS_PASSPHRASE,
#   which the live tests also use. Such an image is for tests only.
#
# With "plain", the job also publishes the image without encryption, as a
# second STORE, and prints its SHA-256. That is what the image builder
# (builder/, docs/own-image.md) encrypts for one person, and what anyone can
# download and hash. It holds no secret: no key, no passphrase, no account.
#
# Secrets: ALEPH_PRIVATE_KEY (pays), PAPERLESS_LUKS_PASSPHRASE (test images).
#
# The image carries no SSH key: root's authorized_keys holds a comment only.
# A test that needs SSH sends its own key with the unlock (the secret
# authorized_keys, which the confidential init adds); the app never does.

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: '"test": an image for the live tests, with the tests'' passphrase. "release": an image for people, with a passphrase of its own (GitHub-hosted runner only).'
        required: true
        default: test
        type: choice
        options:
          - test
          - release
      plain:
        description: Also publish the image without encryption and print its SHA-256 (for the image builder, docs/own-image.md). Costs the storage of a second file.
        required: true
        default: false
        type: boolean
      runner:
        description: Where the job runs. "aleph" needs a runner started with `pnpm relay-button gh-runner up --repo Le-Space/paperless-anywhere`; it uses no hosted minutes.
        required: true
        default: aleph
        type: choice
        options:
          - aleph
          - github-hosted

permissions:
  contents: read

concurrency:
  group: paperless-rootfs
  cancel-in-progress: false

jobs:
  rootfs:
    # For the provenance of the plain image (the step near the end): GitHub
    # signs "this file was built by this workflow at this commit".
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ inputs.runner == 'aleph' && fromJSON('["self-hosted","aleph"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the secrets
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
          LUKS: ${{ secrets.PAPERLESS_LUKS_PASSPHRASE }}
          PURPOSE: ${{ inputs.purpose }}
          RUNNER_CHOICE: ${{ inputs.runner }}
          RECIPIENT: ${{ vars.IMAGE_KEY_RECIPIENT }}
        run: |
          [ -n "$ALEPH_PRIVATE_KEY" ] || { echo "::error::set the ALEPH_PRIVATE_KEY secret"; exit 1; }
          if [ "$PURPOSE" = release ]; then
            [ "$RUNNER_CHOICE" = github-hosted ] || { echo "::error::a release image is built on a GitHub-hosted runner only"; exit 1; }
            [[ "$RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]] || { echo "::error::set the repository variable IMAGE_KEY_RECIPIENT to an age recipient (age1…)"; exit 1; }
          else
            [ -n "$LUKS" ] || { echo "::error::set the PAPERLESS_LUKS_PASSPHRASE secret"; exit 1; }
          fi

      - name: A passphrase for this image only
        id: key
        if: inputs.purpose == 'release'
        env:
          RECIPIENT: ${{ vars.IMAGE_KEY_RECIPIENT }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null
          pass="$(openssl rand -base64 32 | tr -d '\r\n')"
          echo "::add-mask::$pass"
          # Encrypted before anything is built: an image whose passphrase
          # nobody can read is never published.
          printf '%s' "$pass" | age -a -r "$RECIPIENT" > "$RUNNER_TEMP/image-key.age"
          grep -q 'BEGIN AGE ENCRYPTED FILE' "$RUNNER_TEMP/image-key.age"
          echo "passphrase=$pass" >> "$GITHUB_OUTPUT"

      - name: Build the plain image
        # Usually about a minute; a stuck download on a node hung for 45 min.
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq debootstrap debian-archive-keyring >/dev/null
          start=$(date +%s)
          sudo ./rootfs/build-image.sh "$RUNNER_TEMP/paperless.ext4"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/paperless.ext4"
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "PLAIN_BYTES=$(stat -c %s "$RUNNER_TEMP/paperless.ext4")" >> "$GITHUB_ENV"

      - name: Confidential, encrypted, published
        id: rootfs
        uses: NiKrause/relay-button/.github/actions/aleph-confidential-rootfs@28e4e09c2e988a8cd903d457d734be0d0982be62 # v0.12.1
        with:
          image_path: ${{ runner.temp }}/paperless.ext4
          # The action wants a non-empty file; sshd ignores a comment line.
          ssh_public_key: '# no key in the image: a test sends its own with the unlock'
          luks_passphrase: ${{ inputs.purpose == 'release' && steps.key.outputs.passphrase || secrets.PAPERLESS_LUKS_PASSPHRASE }}
          aleph_private_key: ${{ secrets.ALEPH_PRIVATE_KEY }}

      # The same conversion the action above runs (the same script at the same
      # commit), kept this time: the action removes its plain copy.
      - name: Get the conversion script
        if: inputs.plain
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NiKrause/relay-button
          ref: 28e4e09c2e988a8cd903d457d734be0d0982be62 # v0.12.1
          path: relay-button
          persist-credentials: false
          sparse-checkout: |
            packages/rootfs/reference/confidential
            .github/actions/aleph-confidential-rootfs

      - name: Publish the plain image
        id: plain
        if: inputs.plain
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
          ALEPH_API: https://api2.aleph.im
          CHANNEL: ALEPH-CLOUDSOLUTIONS
          # What the builder takes: Aleph's 1 GiB upload, less the 32 MiB the
          # encryption adds (MAX_IMAGE_BYTES in builder/builder.mjs).
          MAX_BYTES: 1040187392
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq e2fsprogs jq qemu-utils rsync >/dev/null
          plain="$RUNNER_TEMP/paperless-plain.ext4"
          printf '%s\n' '# no key in the image: a test sends its own with the unlock' > "$RUNNER_TEMP/plain-authorized_keys"
          sudo MAX_PLAIN_MIB=3500 relay-button/packages/rootfs/reference/confidential/make-confidential-rootfs.sh \
            "$RUNNER_TEMP/paperless.ext4" "$plain" "$RUNNER_TEMP/plain-authorized_keys"
          sudo chown "$(id -u):$(id -g)" "$plain"
          bytes="$(stat -c %s "$plain")"
          [ "$bytes" -le "$MAX_BYTES" ] || { echo "::error::the plain image has $bytes bytes; the builder takes at most $MAX_BYTES"; exit 1; }
          sha="$(sha256sum "$plain" | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"

          dir="$RUNNER_TEMP/plain-store"
          mkdir -p "$dir"
          cp relay-button/.github/actions/aleph-confidential-rootfs/publish-store.mjs "$dir/"
          cd "$dir"
          npm init -y >/dev/null && npm install --silent ethers@6.13.4 ipfs-unixfs-importer@17.1.1 >/dev/null
          node publish-store.mjs "$plain" > store.json
          rm -f "$plain"
          store="$(jq -r .item_hash store.json)"
          [[ "$store" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no STORE hash for the plain image"; exit 1; }
          echo "store=$store" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            status="$(curl -fsS "$ALEPH_API/api/v0/messages/$store" | jq -r .status || true)"
            echo "[$i] STORE $store: $status"
            [ "$status" = processed ] && exit 0
            [ "$status" = rejected ] && { echo "::error::the STORE of the plain image was rejected"; exit 1; }
            sleep 20
          done
          echo "::error::the STORE of the plain image was not processed within 20 minutes"; exit 1

      # A signed statement by GitHub that the plain image with this SHA-256 was
      # built by this workflow at this commit; `gh attestation verify` checks
      # it (docs/own-image.md). GitHub offers this for public repositories, so
      # the step waits until this one is public.
      - name: Provenance of the plain image
        id: provenance
        if: inputs.plain && steps.plain.outputs.sha256 && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: paperless-plain.ext4
          subject-digest: sha256:${{ steps.plain.outputs.sha256 }}

      - name: Summary
        if: always()
        env:
          STORE: ${{ steps.rootfs.outputs.rootfs_item_hash }}
          SIZE_MIB: ${{ steps.rootfs.outputs.rootfs_size_mib }}
          PURPOSE: ${{ inputs.purpose }}
          PLAIN_STORE: ${{ steps.plain.outputs.store }}
          PLAIN_SHA256: ${{ steps.plain.outputs.sha256 }}
          PLAIN_PUBLISHED_BYTES: ${{ steps.plain.outputs.bytes }}
          PROVENANCE: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          {
            echo "## Paperless rootfs"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Encrypted rootfs (STORE) | \`${STORE:-none}\` |"
            echo "| Plain image | $(( ${PLAIN_BYTES:-0} / 1048576 )) MiB, built in ${BUILD_SECONDS:-?} s |"
            echo "| Encrypted image | ${SIZE_MIB:-?} MiB |"
            echo "| Purpose | ${PURPOSE} |"
            echo "| Built from | commit \`${GITHUB_SHA}\` |"
            if [ -n "$PLAIN_STORE" ]; then
              echo
              echo "### Plain image, for the image builder"
              echo
              echo "Public and without a secret. The builder is asked for it by these two values; anyone can download it and compare the hash."
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| Plain image (STORE) | \`${PLAIN_STORE}\` |"
              echo "| SHA-256 | \`${PLAIN_SHA256}\` |"
              echo "| Size | $(( ${PLAIN_PUBLISHED_BYTES:-0} / 1048576 )) MiB |"
              echo "| Built from | commit \`${GITHUB_SHA}\` |"
              echo "| Provenance | ${PROVENANCE:-none: GitHub signs it only for a public repository} |"
            fi
            if [ -s "$RUNNER_TEMP/image-key.age" ] && [ -n "$STORE" ]; then
              echo
              echo "### Passphrase of this image"
              echo
              echo "Encrypted to IMAGE_KEY_RECIPIENT. Read it with \`age -d -i <identity file>\` and enter it in the app together with the STORE hash above."
              echo
              echo '```'
              cat "$RUNNER_TEMP/image-key.age"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
