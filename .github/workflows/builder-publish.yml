name: Image builder on Aleph

# Puts the image builder (builder/, docs/own-image.md) on Aleph as a
# V-PROGRAM with Aleph's CLI, or looks at one that runs, or deletes it.
# The steps and what each shows: builder/vprogram/README.md.
#
#   dry-run  builds the workload and computes the launch measurements; uploads
#            and publishes nothing, costs nothing
#   publish  the same, then uploads the workload and publishes the V-PROGRAM;
#            from then on it costs credits until it is deleted
#   check    shows a published V-PROGRAM and makes one attested call to it
#   delete   forgets a published V-PROGRAM (the scheduler then stops the VM)
#
# Secret: ALEPH_PRIVATE_KEY signs and pays (publish, delete); a dry run also
# signs with it, since the CLI builds the whole message. GitHub-hosted runner
# only. What the summary shows is public on Aleph anyway: the message, its
# sender, the measurements.

on:
  workflow_dispatch:
    inputs:
      action:
        description: '"dry-run": measure only. "publish": start the builder (costs credits until deleted). "check": show a builder and call it, attested. "delete": stop one.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
          - check
          - delete
      hash:
        description: The V-PROGRAM's item hash (64 hex), for "check" and "delete".
        required: false
        default: ''
      memory:
        description: Memory in MiB. One image is built in memory; see builder/vprogram/README.md.
        required: true
        default: '6144'
      vcpus:
        description: Virtual CPUs.
        required: true
        default: '2'
      runtime:
        description: Aleph's compose runtime (a name from the vm-images aggregate).
        required: true
        default: compose-1.4

permissions:
  contents: read

concurrency:
  group: image-builder-on-aleph
  cancel-in-progress: false

env:
  # Aleph's CLI, pinned: the release binary and its SHA-256 as GitHub lists it.
  ALEPH_CLI_VERSION: v0.22.0
  ALEPH_CLI_SHA256: 41b8ced717d9962683ce2d4409725774e826643be0bae1bfc623f6c0c7fb19d7

jobs:
  builder:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the inputs
        env:
          ACTION: ${{ inputs.action }}
          HASH: ${{ inputs.hash }}
          MEMORY: ${{ inputs.memory }}
          VCPUS: ${{ inputs.vcpus }}
          RUNTIME: ${{ inputs.runtime }}
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: |
          [[ "$MEMORY" =~ ^[0-9]{4,6}$ ]] || { echo "::error::memory: MiB, a number"; exit 1; }
          [[ "$VCPUS" =~ ^[1-9][0-9]?$ ]] || { echo "::error::vcpus: a number"; exit 1; }
          [[ "$RUNTIME" =~ ^[a-z0-9.-]{3,40}$ ]] || { echo "::error::runtime: a name such as compose-1.4"; exit 1; }
          case "$ACTION" in
            check|delete) [[ "$HASH" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::\"$ACTION\" needs the V-PROGRAM's item hash (64 hex)"; exit 1; } ;;
          esac
          case "$ACTION" in
            dry-run|publish|delete) [ -n "$ALEPH_PRIVATE_KEY" ] || { echo "::error::set the ALEPH_PRIVATE_KEY secret"; exit 1; } ;;
          esac

      - name: Aleph's CLI and the image tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cryptsetup-bin e2fsprogs jq >/dev/null
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/aleph" \
            "https://github.com/aleph-im/aleph-rs/releases/download/${ALEPH_CLI_VERSION}/aleph-cli-linux-x86_64"
          echo "${ALEPH_CLI_SHA256}  $RUNNER_TEMP/aleph" | sha256sum -c - >/dev/null
          sudo install -m 755 "$RUNNER_TEMP/aleph" /usr/local/bin/aleph
          aleph --version

      - name: The container image, as an archive
        if: inputs.action == 'dry-run' || inputs.action == 'publish'
        working-directory: builder/vprogram
        run: ./build-archive.sh "$RUNNER_TEMP/image-builder.tar" | tee "$RUNNER_TEMP/archive.txt"

      - name: Build and measure; publish if asked
        if: inputs.action == 'dry-run' || inputs.action == 'publish'
        working-directory: builder/vprogram
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
          ACTION: ${{ inputs.action }}
          MEMORY: ${{ inputs.memory }}
          VCPUS: ${{ inputs.vcpus }}
          RUNTIME: ${{ inputs.runtime }}
        run: |
          image="$(sed -n 's/^ *image: *//p' docker-compose.yml)"
          create=(aleph vprogram create paperless-image-builder --compose docker-compose.yml
            --image-archive "$image=$RUNNER_TEMP/image-builder.tar" --runtime "$RUNTIME"
            --vcpus "$VCPUS" --memory "$MEMORY" --chain eth --json)
          # First without publishing, up to three times: fetching Aleph's
          # runtime bundle (about 270 MB) sometimes runs into the CLI's timeout.
          # Nothing is uploaded here, so a retry repeats nothing.
          for try in 1 2 3; do
            if "${create[@]}" --dry-run > "$RUNNER_TEMP/dry-run.json" 2> "$RUNNER_TEMP/dry-run.log"; then break; fi
            tail -5 "$RUNNER_TEMP/dry-run.log"
            [ "$try" = 3 ] && { echo "::error::the dry run failed three times"; exit 1; }
            sleep 20
          done
          tail -20 "$RUNNER_TEMP/dry-run.log"
          if [ "$ACTION" = publish ]; then
            # Once, without a retry: a second try after a half-done publication
            # could start a second builder.
            "${create[@]}" --wait 600 > "$RUNNER_TEMP/publish.json" 2> >(tee "$RUNNER_TEMP/publish.log" >&2)
          fi

      - name: Show it and call it, attested
        if: inputs.action == 'check'
        env:
          HASH: ${{ inputs.hash }}
        run: |
          aleph vprogram show "$HASH" --json > "$RUNNER_TEMP/show.json"
          # Answers only if the AMD chain, the key binding, the pinned
          # measurement, the policy and a fresh nonce all check out.
          aleph vprogram call "$HASH" / --verbose > "$RUNNER_TEMP/call.txt" 2> "$RUNNER_TEMP/call.log" || { cat "$RUNNER_TEMP/call.log"; echo "::error::the attested call failed"; exit 1; }
          cat "$RUNNER_TEMP/call.log" "$RUNNER_TEMP/call.txt"
          grep -q 'paperless-anywhere image builder' "$RUNNER_TEMP/call.txt" || { echo "::error::the builder did not answer as the image builder"; exit 1; }

      - name: Delete it
        if: inputs.action == 'delete'
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
          HASH: ${{ inputs.hash }}
        run: aleph vprogram delete "$HASH" --yes --chain eth --reason "image builder stopped" --json > "$RUNNER_TEMP/delete.json"

      - name: Summary
        if: always()
        env:
          ACTION: ${{ inputs.action }}
          HASH: ${{ inputs.hash }}
        run: |
          block() { # <title> <file>
            [ -s "$2" ] || return 0
            { echo; echo "### $1"; echo; echo '```'; cat "$2"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "## Image builder on Aleph: ${ACTION}"
            if [ "$ACTION" = publish ] && [ -s "$RUNNER_TEMP/publish.json" ]; then
              echo
              echo "The builder is published and **costs credits until it is deleted** (action \"delete\" with its item hash)."
            fi
            if [ "$ACTION" = dry-run ]; then
              echo
              echo "Nothing was uploaded or published. The hash tree gets a new salt at every build, so a later publication has other measurements than this dry run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          block "Container image" "$RUNNER_TEMP/archive.txt"
          block "Published V-PROGRAM" "$RUNNER_TEMP/publish.json"
          [ "$ACTION" = dry-run ] && block "What would be published" "$RUNNER_TEMP/dry-run.json"
          block "V-PROGRAM ${HASH}" "$RUNNER_TEMP/show.json"
          block "Attested call" "$RUNNER_TEMP/call.log"
          block "Answer" "$RUNNER_TEMP/call.txt"
          block "Deleted" "$RUNNER_TEMP/delete.json"
          exit 0
