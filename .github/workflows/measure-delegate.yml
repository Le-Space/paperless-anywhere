name: Measure who pays for a delegated INSTANCE

# #3: the PWA is to start VMs with its own key, authorized by the paying
# account for INSTANCE and FORGET only. Which account's credits does such an
# INSTANCE draw on: the owner's (content.address) or the sender's? A fresh
# delegate without credits starts a small, normal (not confidential) VM on
# behalf of the owner (ALEPH_PRIVATE_KEY); both credit histories are compared
# for expenses that reference that VM. Then the delegate forgets it (FORGET by
# delegation) and the owner revokes the authorization. Last, the delegate
# tries a second INSTANCE after the revocation: Aleph must refuse it
# (le-space-credits#38 relies on that to end a customer's starts).
#
# With reduced=true the revocation is the one le-space-credits#39 posts: the
# delegate stays in the owner's security aggregate, but only for FORGET and
# AGGREGATE on the key port-forwarding. Then a new INSTANCE must be refused,
# while the delegate can still write port-forwarding. Measured (run
# 42575506726): the INSTANCE is refused, and so is the delegate's FORGET of
# its VM: Aleph lets a delegate forget a message only if it could have
# created it (pyaleph permissions.is_sender_authorized_for_owner), so after
# the reduction only the owner can forget the VM.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to let the VM run before reading the credit histories
        required: false
        default: '15'
        type: string
      reduced:
        description: Revoke by reducing the entry to FORGET + port-forwarding (le-space-credits#39) instead of removing it
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: paperless-try
  cancel-in-progress: false

env:
  ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
  NAME: delegate-measure-${{ github.run_id }}

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Tools and keys
        id: keys
        run: |
          curl -fsSL -o "$RUNNER_TEMP/aleph" https://github.com/aleph-im/aleph-rs/releases/download/v0.22.0/aleph-cli-linux-x86_64
          echo "41b8ced717d9962683ce2d4409725774e826643be0bae1bfc623f6c0c7fb19d7  $RUNNER_TEMP/aleph" | sha256sum -c -
          sudo install -m 755 "$RUNNER_TEMP/aleph" /usr/local/bin/aleph
          pip install -q eth-account
          umask 077
          python3 - "$RUNNER_TEMP" <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, secrets
          from eth_account import Account
          k = os.environ["ALEPH_PRIVATE_KEY"].strip()
          owner = Account.from_key(k if k.startswith("0x") else "0x" + k).address
          d = "0x" + secrets.token_hex(32)
          open(os.path.join(sys.argv[1], "delegate.key"), "w").write(d)
          print(f"owner={owner}")
          print(f"delegate={Account.from_key(d).address}")
          PY
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/m_ed25519"

      - name: Balances before
        env:
          OWNER: ${{ steps.keys.outputs.owner }}
          DELEGATE: ${{ steps.keys.outputs.delegate }}
        run: |
          for a in "$OWNER" "$DELEGATE"; do echo "$a: $(aleph account balance "$a" --json | jq -c '{credits}')"; done
          echo "START=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"

      - name: The owner authorizes the delegate for INSTANCE and FORGET
        env:
          DELEGATE: ${{ steps.keys.outputs.delegate }}
        run: aleph authorization add "$DELEGATE" --message-types instance,forget --chain eth

      - name: The delegate starts a VM on behalf of the owner
        id: vm
        env:
          OWNER: ${{ steps.keys.outputs.owner }}
        run: |
          set -o pipefail
          sleep 20
          aleph instance create "$NAME" --image debian12 --size 1vcpu-2gb --ssh-pubkey-file "$RUNNER_TEMP/m_ed25519.pub" \
            --on-behalf-of "$OWNER" --private-key "$(cat "$RUNNER_TEMP/delegate.key")" --chain eth --wait 600 2>&1 | tee "$RUNNER_TEMP/create.log" || status=$?
          hash="$(grep -oE 'Item hash: +[0-9a-f]{64}' "$RUNNER_TEMP/create.log" | grep -oE '[0-9a-f]{64}' | head -1 || true)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          [ -n "$hash" ] || { echo "::error::the delegate's INSTANCE was not accepted"; exit 1; }
          curl -fsS "https://api2.aleph.im/api/v0/messages/$hash" | jq -c '{status, sender: .message.sender, address: .message.content.address, payment: .message.content.payment}'
          exit "${status:-0}"

      - name: Let it run, then read who paid
        env:
          OWNER: ${{ steps.keys.outputs.owner }}
          DELEGATE: ${{ steps.keys.outputs.delegate }}
          HASH: ${{ steps.vm.outputs.hash }}
        run: |
          sleep $(( ${{ inputs.minutes || '15' }} * 60 ))
          for a in "$OWNER" "$DELEGATE"; do
            echo "== $a"
            echo "balance: $(aleph account balance "$a" --json | jq -c '{credits}')"
            aleph credit history --address "$a" --start "$START" --page-size 200 --json \
              | jq -c --arg h "$HASH" '[.credit_history[] | select(.credit_ref == $h)] | {expenses_for_this_vm: length, credits: (map(.amount) | add // 0)}'
          done

      - name: The owner reduces the delegate to FORGET and port-forwarding
        if: inputs.reduced && steps.vm.outputs.hash != ''
        env:
          OWNER: ${{ steps.keys.outputs.owner }}
          DELEGATE: ${{ steps.keys.outputs.delegate }}
        run: |
          aleph authorization revoke "$DELEGATE" --chain eth
          aleph authorization add "$DELEGATE" --message-types forget,aggregate --aggregate-keys port-forwarding --chain eth
          sleep 60
          curl -fsS "https://api2.aleph.im/api/v0/aggregates/$OWNER.json?keys=security" \
            | jq -c --arg d "$DELEGATE" '[.data.security.authorizations[] | select(.address == $d) | {types, aggregate_keys}]' || true

      - name: With the reduced entry, a new INSTANCE from the delegate is refused
        if: inputs.reduced && steps.vm.outputs.hash != ''
        env:
          OWNER: ${{ steps.keys.outputs.owner }}
        run: |
          aleph instance create "$NAME-reduced" --image debian12 --size 1vcpu-2gb --ssh-pubkey-file "$RUNNER_TEMP/m_ed25519.pub" \
            --on-behalf-of "$OWNER" --private-key "$(cat "$RUNNER_TEMP/delegate.key")" --chain eth --wait 180 > "$RUNNER_TEMP/reduced.log" 2>&1 || true
          tail -5 "$RUNNER_TEMP/reduced.log"
          hash="$(grep -oE 'Item hash: +[0-9a-f]{64}' "$RUNNER_TEMP/reduced.log" | grep -oE '[0-9a-f]{64}' | head -1 || true)"
          if [ -z "$hash" ]; then
            echo "REDUCED 1: the delegate's INSTANCE was not even accepted for processing"
            exit 0
          fi
          status="$(curl -fsS "https://api2.aleph.im/api/v0/messages/$hash" | jq -r .status)"
          echo "REDUCED 1: the delegate's INSTANCE has status $status"
          if [ "$status" = processed ]; then
            echo "::error::Aleph processed an INSTANCE from a delegate reduced to FORGET + port-forwarding"
            aleph message forget "$hash" --reason "delegate measure ${GITHUB_RUN_ID} (reduced)" --chain eth -y || true
            exit 1
          fi

      - name: With the reduced entry, the delegate still writes port-forwarding
        if: inputs.reduced && steps.vm.outputs.hash != ''
        env:
          OWNER: ${{ steps.keys.outputs.owner }}
          HASH: ${{ steps.vm.outputs.hash }}
        run: |
          # `create` refuses an existing key; `edit --subkey` merges one entry in.
          out="$(aleph aggregate edit --key port-forwarding --subkey "$HASH" --content '{"ports":{"22":{"tcp":true,"udp":false}}}' \
            --on-behalf-of "$OWNER" --private-key "$(cat "$RUNNER_TEMP/delegate.key")" --chain eth -y --json 2>&1)" || true
          hash="$(printf '%s' "$out" | grep -oE '[0-9a-f]{64}' | head -1 || true)"
          if [ -z "$hash" ]; then
            echo "REDUCED 3: the delegate's port-forwarding AGGREGATE was not accepted"; printf '%s\n' "$out" | tail -5
            echo "::warning::the reduced entry does not let the delegate write port-forwarding"
            exit 0
          fi
          sleep 20
          echo "REDUCED 3: the delegate's port-forwarding AGGREGATE has status $(curl -fsS "https://api2.aleph.im/api/v0/messages/$hash" | jq -r .status)"

      - name: The delegate forgets the VM; the owner revokes the authorization
        if: always()
        env:
          OWNER: ${{ steps.keys.outputs.owner }}
          DELEGATE: ${{ steps.keys.outputs.delegate }}
          HASH: ${{ steps.vm.outputs.hash }}
        run: |
          if [ -n "$HASH" ]; then
            # `aleph instance delete` has no --on-behalf-of, and refuses an
            # instance whose sender is someone else; a raw FORGET does both.
            if aleph message forget "$HASH" --reason "delegate measure ${GITHUB_RUN_ID}" \
                --on-behalf-of "$OWNER" --private-key "$(cat "$RUNNER_TEMP/delegate.key")" --chain eth -y; then
              echo "FORGET by the delegate: accepted"
            else
              echo "FORGET by the delegate failed; the owner forgets it"
              aleph message forget "$HASH" --reason "delegate measure ${GITHUB_RUN_ID}" --chain eth -y || true
            fi
            sleep 20
            echo "instance now: $(curl -fsS "https://api2.aleph.im/api/v0/messages/$HASH" | jq -r .status)"
          fi
          aleph authorization revoke "$DELEGATE" --chain eth || true
          # The test VM's port-forwarding entry goes again.
          if [ -n "$HASH" ] && [ "${{ inputs.reduced }}" = true ]; then
            aleph aggregate unset --key port-forwarding --subkey "$HASH" --chain eth -y || true
          fi

      - name: After the revocation, a new INSTANCE from the delegate is refused
        if: always() && !inputs.reduced && steps.vm.outputs.hash != ''
        env:
          OWNER: ${{ steps.keys.outputs.owner }}
        run: |
          # Aleph reads the security aggregate when it processes the message;
          # give the revocation time to be processed first.
          sleep 60
          aleph instance create "$NAME-revoked" --image debian12 --size 1vcpu-2gb --ssh-pubkey-file "$RUNNER_TEMP/m_ed25519.pub" \
            --on-behalf-of "$OWNER" --private-key "$(cat "$RUNNER_TEMP/delegate.key")" --chain eth --wait 180 > "$RUNNER_TEMP/revoked.log" 2>&1 || true
          tail -5 "$RUNNER_TEMP/revoked.log"
          hash="$(grep -oE 'Item hash: +[0-9a-f]{64}' "$RUNNER_TEMP/revoked.log" | grep -oE '[0-9a-f]{64}' | head -1 || true)"
          if [ -z "$hash" ]; then
            echo "REVOKED: the delegate's INSTANCE was not even accepted for processing"
            exit 0
          fi
          status="$(curl -fsS "https://api2.aleph.im/api/v0/messages/$hash" | jq -r .status)"
          echo "REVOKED: the delegate's INSTANCE after revocation has status $status"
          if [ "$status" = processed ]; then
            echo "::error::Aleph processed an INSTANCE from a revoked delegate"
            aleph message forget "$hash" --reason "delegate measure ${GITHUB_RUN_ID} (revoked)" --chain eth -y || true
            exit 1
          fi
