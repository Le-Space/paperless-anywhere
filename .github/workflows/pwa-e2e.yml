name: PWA start and stop

# The PWA in Chromium starts a confidential Paperless and stops it again, as a
# person would (#3): a virtual passkey with PRF, the test wallet as the paying
# account (injected as window.ethereum), the real Aleph, a real SEV-SNP node,
# and relay-button's attest relay beside the test. The PWA's key starts and
# forgets the VM on behalf of the test wallet. Made-up nothing: an empty
# Paperless, no backups. The round is done in the v0.2 interface (/v0.2/) or in
# the app (/app/), as chosen.

on:
  workflow_dispatch:
    inputs:
      rootfs_item_hash:
        description: Encrypted Paperless rootfs (the STORE from "Paperless rootfs", purpose "test"). Empty with only_cleanup.
        required: false
        default: ''
        type: string
      crn:
        description: SEV-SNP node (full hash)
        required: true
        default: bb0aa1a9fc7566286c0db32cd5c660066017430390ca779da4d3a241fa07c337
        type: string
      interface:
        description: Which interface does the round (one VM per run)
        required: true
        default: v0.2
        type: choice
        options:
          - v0.2
          - app
      only_cleanup:
        description: Start no VM; only forget the Paperless VMs of the test wallet started since cleanup_since and take back the PWA authorizations (after a run whose cleanup missed one).
        required: true
        default: false
        type: boolean
      cleanup_since:
        description: With only_cleanup, the time from which VMs are forgotten, in UTC (2026-11-18T07:57:00Z).
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: paperless-try
  cancel-in-progress: false

jobs:
  start-stop:
    if: ${{ !inputs.only_cleanup }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: The image is named
        env:
          ROOTFS_ITEM_HASH: ${{ inputs.rootfs_item_hash }}
        run: |
          [[ "$ROOTFS_ITEM_HASH" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::rootfs_item_hash takes the STORE hash of a test image (64 hex characters)"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: The attest relay (relay-button v0.10.0) on 127.0.0.1:8787
        run: |
          git clone -q --depth 1 --branch v0.10.0 https://github.com/NiKrause/relay-button.git "$RUNNER_TEMP/relay-button"
          cd "$RUNNER_TEMP/relay-button"
          pnpm install --frozen-lockfile --ignore-scripts --prefer-offline --filter @le-space/attest-relay... > /dev/null
          ATTEST_RELAY_HOST=127.0.0.1 ATTEST_RELAY_PORT=8787 nohup node packages/attest-relay/src/server.ts > "$RUNNER_TEMP/attest-relay.log" 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/health && break; sleep 1; done

      - name: Build the PWA
        working-directory: pwa
        env:
          # The relay of this run listens on this machine without TLS; the
          # app's content security policy lets a build name such addresses.
          CSP_CONNECT_LOCAL: ws://127.0.0.1:8787
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm exec playwright install --with-deps chromium > /dev/null

      - name: Start and stop from the PWA
        working-directory: pwa
        env:
          PAYER_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
          LUKS_PASSPHRASE: ${{ secrets.PAPERLESS_LUKS_PASSPHRASE }}
          ROOTFS_ITEM_HASH: ${{ inputs.rootfs_item_hash }}
          CRN_HASH: ${{ inputs.crn }}
          RELAY_URL: ws://127.0.0.1:8787/attest
          INTERFACE: ${{ inputs.interface }}
        # One round per run: the chosen interface's test only.
        run: pnpm exec playwright test -c playwright.live.config.js "e2e-live/$([ "$INTERFACE" = app ] && echo start-stop || echo v2-start-stop).spec.js" --reporter=line

      - name: Attest relay log
        if: always()
        run: tail -40 "$RUNNER_TEMP/attest-relay.log" || true

      # No artifact from this run: test-results would hold what the test typed
      # (recovery words, the image's passphrase). The line reporter and the
      # relay log above are what a failed run leaves.

  # Runs even when the test was cancelled or timed out: forget every
  # Paperless VM of the test wallet started since this run began, and take
  # back every authorization a run gave a PWA key.
  cleanup:
    needs: start-stop
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Only for the lockfile of the tool that derives the address below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/eth-tool
          persist-credentials: false
      - name: Install the aleph CLI and the address tool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/aleph" https://github.com/aleph-im/aleph-rs/releases/download/v0.22.0/aleph-cli-linux-x86_64
          echo "41b8ced717d9962683ce2d4409725774e826643be0bae1bfc623f6c0c7fb19d7  $RUNNER_TEMP/aleph" | sha256sum -c -
          sudo install -m 755 "$RUNNER_TEMP/aleph" /usr/local/bin/aleph
          # The exact packages of the lockfile in .github/eth-tool, without install scripts.
          mkdir -p "$RUNNER_TEMP/eth"
          cp "$GITHUB_WORKSPACE/.github/eth-tool/package.json" "$GITHUB_WORKSPACE/.github/eth-tool/package-lock.json" "$RUNNER_TEMP/eth/"
          (cd "$RUNNER_TEMP/eth" && npm ci --ignore-scripts --no-audit --no-fund --loglevel=error >/dev/null)
      - name: Forget leftover VMs, revoke PWA authorizations
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          ONLY_CLEANUP: ${{ inputs.only_cleanup }}
          CLEANUP_SINCE: ${{ inputs.cleanup_since }}
        run: |
          addr="$(node -e 'const { Wallet } = require(process.argv[1]); const k = process.env.ALEPH_PRIVATE_KEY.trim(); console.log(new Wallet(k.startsWith("0x") ? k : "0x" + k).address)' "$RUNNER_TEMP/eth/node_modules/ethers")"
          since="$(gh run view ${{ github.run_id }} -R ${{ github.repository }} --json createdAt -q .createdAt 2>/dev/null || date -u -d '-2 hours' +%FT%TZ)"
          if [ "$ONLY_CLEANUP" = true ]; then
            [[ "$CLEANUP_SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || { echo "::error::cleanup_since takes a time in UTC, as 2026-11-18T07:57:00Z"; exit 1; }
            since="$CLEANUP_SINCE"
          fi
          echo "forgetting the Paperless VMs of $addr started since $since"
          # By owner, not by sender: the PWA starts the VM with its own key on
          # behalf of the test wallet, so the wallet owns a message it did not send.
          hashes="$(curl -fsS "https://api2.aleph.im/api/v0/messages.json?owners=$addr&msgTypes=INSTANCE&pagination=50" \
            | jq -r --arg since "$since" '.messages[] | select((.content.metadata.name // "") | startswith("paperless-")) | select((.time | todate) >= $since) | .item_hash')"
          for h in $hashes; do echo "forgetting $h"; aleph message forget "$h" --reason "pwa e2e ${GITHUB_RUN_ID} (cleanup)" --chain eth -y || true; done
          [ -n "$hashes" ] || echo "no VM of this run is left"
          # Said, not assumed: what the wallet still owns after the forgets.
          sleep 20
          still="$(curl -fsS "https://api2.aleph.im/api/v0/messages.json?owners=$addr&msgTypes=INSTANCE&pagination=50" \
            | jq -r --arg since "$since" '[.messages[] | select((.content.metadata.name // "") | startswith("paperless-")) | select((.time | todate) >= $since) | .item_hash] | join(" ")')"
          [ -z "$still" ] || { echo "::error::still on Aleph after the cleanup: $still"; failed=1; }
          left="$(curl -fsS "https://api2.aleph.im/api/v0/aggregates/$addr.json?keys=security" | jq -c '[.data.security.authorizations[]? | select((.aggregate_keys // []) | index("port-forwarding"))] | length')"
          if [ "${left:-0}" != 0 ]; then
            for a in $(curl -fsS "https://api2.aleph.im/api/v0/aggregates/$addr.json?keys=security" | jq -r '.data.security.authorizations[]? | select((.aggregate_keys // []) | index("port-forwarding")) | .address'); do
              aleph authorization revoke "$a" --chain eth || true
            done
          fi
          exit "${failed:-0}"
