name: Image retention

# Older versions of the own-image builder: which of their STOREs on Aleph may
# be forgotten (the plain image, the builder's workload and volume and their
# hash trees). Started by hand only, never on a release.
#
#   dry-run  prints which versions stay, which STOREs would go, their size,
#            what that saves, and the list's id. Forgets nothing.
#   forget   the same, then forgets exactly that list: only when the id given
#            here is the one the dry run printed, so the list cannot have
#            changed in between. A FORGET is final.
#
# What stays: the newest `keep` versions, the builder on main, and every
# version a release still in use names (the newest release, and each one for
# `grace_days` after its successor came out): an app on an older release
# builds with that release's builder. The rules: pwa/src/lib/image-retention.js
# and pwa/src/lib/forget-guard.js; one refusal forgets nothing.
#
# A vault's own image is a STORE of its own and does not depend on these;
# encrypted Paperless images (what a vault starts from) are never on the list.

on:
  workflow_dispatch:
    inputs:
      action:
        description: '"dry-run": show what would go. "forget": forget exactly the list of a dry run (needs its list id).'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - forget
      keep:
        description: How many of the newest builder versions stay.
        required: true
        default: '3'
      grace_days:
        description: Days a release stays in use after its successor came out.
        required: true
        default: '14'
      list_id:
        description: 'For "forget": the list id the dry run printed.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: image-retention
  cancel-in-progress: false

env:
  ALEPH_CLI_VERSION: v0.22.0
  ALEPH_CLI_SHA256: 41b8ced717d9962683ce2d4409725774e826643be0bae1bfc623f6c0c7fb19d7

jobs:
  retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Check the inputs
        env:
          ACTION: ${{ inputs.action }}
          KEEP: ${{ inputs.keep }}
          GRACE: ${{ inputs.grace_days }}
          LIST_ID: ${{ inputs.list_id }}
        run: |
          [[ "$KEEP" =~ ^[1-9][0-9]?$ ]] || { echo "::error::keep: a number from 1"; exit 1; }
          [[ "$GRACE" =~ ^[0-9]{1,3}$ ]] || { echo "::error::grace_days: a number of days"; exit 1; }
          if [ "$ACTION" = forget ]; then
            [[ "$LIST_ID" =~ ^[0-9a-f]{16}$ ]] || { echo "::error::\"forget\" needs the list id of a dry run (16 hex)"; exit 1; }
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      # No install scripts, and no secret in the step that installs.
      - name: The PWA's modules
        working-directory: pwa
        run: pnpm install --frozen-lockfile --ignore-scripts > /dev/null

      - name: The account and the releases
        id: account
        working-directory: pwa
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$ALEPH_PRIVATE_KEY" ] || { echo "::error::set the ALEPH_PRIVATE_KEY secret"; exit 1; }
          # Only the address leaves this step, never the key.
          address="$(node --input-type=module -e "
            import { privateKeyToAccount } from 'viem/accounts';
            const k = process.env.ALEPH_PRIVATE_KEY.trim();
            console.log(privateKeyToAccount(k.startsWith('0x') ? k : '0x' + k).address);")"
          echo "address=$address" >> "$GITHUB_OUTPUT"
          gh release list -R "$GITHUB_REPOSITORY" -L 1000 --json tagName,publishedAt > "$RUNNER_TEMP/releases.json"
          echo "account $address, $(jq length "$RUNNER_TEMP/releases.json") releases"

      - name: What may go
        working-directory: pwa
        env:
          ACTION: ${{ inputs.action }}
          KEEP: ${{ inputs.keep }}
          GRACE: ${{ inputs.grace_days }}
          LIST_ID: ${{ inputs.list_id }}
          ACCOUNT: ${{ steps.account.outputs.address }}
        run: |
          # A refusal or another list id ends the run here, before anything is forgotten.
          set -o pipefail
          expect=()
          [ "$ACTION" = forget ] && expect=(--expect "$LIST_ID")
          node scripts/image-retention.mjs --releases "$RUNNER_TEMP/releases.json" --account "$ACCOUNT" \
            --keep "$KEEP" --grace-days "$GRACE" --list "$RUNNER_TEMP/forget.txt" "${expect[@]}" | tee "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Aleph's CLI
        if: inputs.action == 'forget'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/aleph" \
            "https://github.com/aleph-im/aleph-rs/releases/download/${ALEPH_CLI_VERSION}/aleph-cli-linux-x86_64"
          echo "${ALEPH_CLI_SHA256}  $RUNNER_TEMP/aleph" | sha256sum -c - >/dev/null
          sudo install -m 755 "$RUNNER_TEMP/aleph" /usr/local/bin/aleph

      - name: Forget them
        if: inputs.action == 'forget'
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: |
          [ -s "$RUNNER_TEMP/forget.txt" ] || { echo "nothing to forget"; exit 0; }
          echo "forgetting:"; cat "$RUNNER_TEMP/forget.txt"
          aleph message forget $(cat "$RUNNER_TEMP/forget.txt") --reason "retired image builder version" --chain eth --yes
          { echo; echo "### Forgotten"; echo; sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/forget.txt"; } >> "$GITHUB_STEP_SUMMARY"
