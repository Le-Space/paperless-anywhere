name: PWA deploy

# The PWA goes to paperless.le-space.de the way Belege goes to
# belege.le-space.de: tested, built, published to Aleph IPFS, and the domain
# pointed at that CID. Only a published release (or a dispatch with
# link_domain) moves the domain; a dispatch without it publishes for a look.
# The site holds no secret: keys come from the passkey in the browser.
#
# One job on a GitHub-hosted runner: the repository is public, so hosted
# minutes cost nothing, and a release never waits for a runner someone has to
# start. A dispatch may still choose a self-hosted Aleph runner; a release
# cannot.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      link_domain:
        description: Point paperless.le-space.de at this build (off for a test publish)
        type: boolean
        default: false
      runner:
        description: Where the job runs ("aleph" is a self-hosted runner from relay-button's gh-runner; since the repository is public it starts only with --allow-public and is rarely needed)
        type: choice
        options: [ubuntu-24.04, aleph]
        default: ubuntu-24.04
      first_host:
        description: The Aleph host the upload is tried at first (the other two follow)
        type: choice
        options: [api2, api, api3]
        default: api2
      item_hash:
        description: Link an upload that is on Aleph already, without building or uploading again (the STORE's item hash, from a failed run's summary). Needs ipfs_cid.
        type: string
        default: ''
      ipfs_cid:
        description: The CID of that upload (bafy…)
        type: string
        default: ''

permissions:
  contents: write # the CID goes onto the release

concurrency:
  group: pwa-deploy
  cancel-in-progress: false

env:
  SITE_DOMAIN: paperless.le-space.de

jobs:
  deploy:
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'aleph') && fromJSON('["self-hosted","aleph"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Unit tests, build, browser tests (mocked Aleph)
        if: inputs.item_hash == ''
        working-directory: pwa
        env:
          # Shown in the app's footer; a dispatch builds show "dev".
          PAPERLESS_VERSION: ${{ github.event.release.tag_name }}
          # Le Space Credits (credits.le-space.de). A repository variable, so it
          # is switched on once the service runs; empty keeps the credits hidden.
          VITE_CREDITS_URL: ${{ vars.VITE_CREDITS_URL }}
        run: |
          pnpm install --frozen-lockfile
          # Where the confidential nodes stand (landing page); keeps the last places if the lookup fails.
          node scripts/crn-places.mjs
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium > /dev/null
          pnpm exec playwright test --reporter=line

      - name: Install isolated Aleph deploy tooling
        # The exact packages of the lockfile in .github/deploy-tool, and none of
        # their install scripts: the next steps hold the key that signs and pays.
        run: |
          mkdir -p "$RUNNER_TEMP/le-space-deployer"
          cp .github/deploy-tool/package.json .github/deploy-tool/package-lock.json "$RUNNER_TEMP/le-space-deployer/"
          cd "$RUNNER_TEMP/le-space-deployer" && npm ci --ignore-scripts --no-audit --no-fund --loglevel=error

      - name: Publish to Aleph IPFS
        id: publish
        if: inputs.item_hash == ''
        env:
          ALEPH_VM_MODE: site-publish
          ALEPH_SITE_DIRECTORY: ${{ github.workspace }}/pwa/build
          ALEPH_SITE_PIN: 'true'
          ALEPH_SITE_NAME: paperless-anywhere
          ALEPH_SITE_RETENTION_KEEP_COUNT: '3'
          ALEPH_SITE_CHANNEL: ALEPH-CLOUDSOLUTIONS
          # Three API nodes for the CAR upload, each with its gateway, tried in
          # this order (as Belege's deploy and relay-button's defaults since
          # 0.12.3). On 2026-11-13 api2 answered every upload with 502 for
          # hours, because its IPFS backend could not be reached; api3.aleph.im
          # is a core channel node with a backend of its own. One host is one
          # point of failure for the whole release. Waiting for the STORE and
          # the retention then use the host that took the upload.
          # A run by hand can put another host first (first_host): the tool
          # moves on only when an upload fails, not when the gateway does not
          # serve what a host took.
          ALEPH_SITE_ENDPOINT_PAIRS: ${{ inputs.first_host == 'api3' && '[{"ipfsGateway":"https://ipfs-2.aleph.im","apiHost":"https://api3.aleph.im"},{"ipfsGateway":"https://ipfs-2.aleph.im","apiHost":"https://api2.aleph.im"},{"ipfsGateway":"https://ipfs.aleph.cloud","apiHost":"https://api.aleph.im"}]' || inputs.first_host == 'api' && '[{"ipfsGateway":"https://ipfs.aleph.cloud","apiHost":"https://api.aleph.im"},{"ipfsGateway":"https://ipfs-2.aleph.im","apiHost":"https://api3.aleph.im"},{"ipfsGateway":"https://ipfs-2.aleph.im","apiHost":"https://api2.aleph.im"}]' || '[{"ipfsGateway":"https://ipfs-2.aleph.im","apiHost":"https://api2.aleph.im"},{"ipfsGateway":"https://ipfs.aleph.cloud","apiHost":"https://api.aleph.im"},{"ipfsGateway":"https://ipfs-2.aleph.im","apiHost":"https://api3.aleph.im"}]' }}
          # After the STORE the tool asks <cid>.ipfs.aleph.sh for the site: the
          # gateway that also serves the domain. It may need a while to fetch a
          # new upload from the node that took it; wait up to 20 minutes
          # (default: 5).
          ALEPH_SITE_GATEWAY_WAIT_ATTEMPTS: '240'
          ALEPH_SITE_GATEWAY_WAIT_DELAY_MS: '5000'
          # Wait up to 20 minutes for Aleph to process the STORE (default: 5).
          ALEPH_SITE_ALEPH_MESSAGE_WAIT_ATTEMPTS: '240'
          ALEPH_SITE_ALEPH_MESSAGE_WAIT_DELAY_MS: '5000'
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: |
          # One attempt goes through all three hosts. A second one covers a
          # short outage of all of them. Once Aleph has taken an upload, nothing
          # is uploaded again: neither when the STORE stays pending, nor when
          # the gateway does not serve the site yet (2026-11-13: a second
          # upload to the same host paid a second STORE and changed nothing).
          # The upload can be linked later, see "Link an upload that is on
          # Aleph already".
          for attempt in 1 2; do
            if node --input-type=module -e "import('$RUNNER_TEMP/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())" 2> >(tee "$RUNNER_TEMP/publish-err.txt" >&2); then
              exit 0
            fi
            if grep -q 'stayed pending after the wait window' "$RUNNER_TEMP/publish-err.txt"; then
              echo "::error::Aleph did not process the STORE within 20 minutes. The files are on IPFS; run this workflow again later instead of re-uploading now."
              exit 1
            fi
            if grep -q 'did not serve expected CID' "$RUNNER_TEMP/publish-err.txt"; then
              echo "::error::The upload is on Aleph, but the gateway that serves the domain does not have it yet. Nothing was linked; the site is unchanged. Run this workflow by hand later with item_hash and ipfs_cid from the summary: that links this upload without uploading again."
              exit 1
            fi
            [ "$attempt" = 2 ] && break
            echo "::warning::publish attempt $attempt failed on every host, once more in 60 s"
            sleep 60
          done
          exit 1

      # An upload from an earlier run: the domain is served by Aleph's gateway at
      # aleph.sh, so that gateway must serve this CID before the domain may
      # point at it. Otherwise the live site would go dark.
      - name: Link an upload that is on Aleph already
        if: inputs.item_hash != ''
        env:
          ITEM_HASH: ${{ inputs.item_hash }}
          CID: ${{ inputs.ipfs_cid }}
        run: |
          echo "$ITEM_HASH" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::item_hash is not a STORE's item hash (64 hex characters)"; exit 1; }
          echo "$CID" | grep -Eq '^bafy[a-z2-7]{50,}$' || { echo "::error::ipfs_cid is not a CID (bafy…)"; exit 1; }
          status="$(curl -fsS "https://api2.aleph.im/api/v0/messages/$ITEM_HASH" | jq -r '[.status, .message.type, .message.content.item_hash] | @tsv')"
          [ "$status" = "$(printf 'processed\tSTORE\t%s' "$CID")" ] || { echo "::error::Aleph does not know a processed STORE $ITEM_HASH for this CID (got: $status)"; exit 1; }
          for i in $(seq 1 60); do
            roots="$(curl -sS -m 30 -o /dev/null -D - "https://$CID.ipfs.aleph.sh/" 2>/dev/null | tr -d '\r' | awk 'tolower($1)=="x-ipfs-roots:"{print $2}')"
            [ "$roots" = "$CID" ] && { echo "the gateway serves $CID"; exit 0; }
            sleep 10
          done
          echo "::error::https://$CID.ipfs.aleph.sh does not serve the site yet. Nothing was linked; try again later."
          exit 1

      - name: Link the custom domain
        if: github.event_name == 'release' || inputs.link_domain || inputs.item_hash != ''
        env:
          ALEPH_VM_MODE: site-domain-link
          ALEPH_SITE_ITEM_HASH: ${{ inputs.item_hash || steps.publish.outputs.item_hash }}
          ALEPH_SITE_IPFS_CID: ${{ inputs.ipfs_cid || steps.publish.outputs.ipfs_cid }}
          ALEPH_SITE_DOMAIN: ${{ env.SITE_DOMAIN }}
          ALEPH_SITE_DOMAIN_CATCH_ALL_PATH: /200.html
          # The host that took the upload first: it knows the STORE at once.
          # The others follow, should it fail in the meantime.
          # (The tool drops an empty entry and doubles.)
          ALEPH_SITE_ALEPH_API_HOSTS: ${{ steps.publish.outputs.aleph_api_host }},https://api2.aleph.im,https://api.aleph.im,https://api3.aleph.im
          # The gateway may serve the previous CID from its cache for a while
          # (v0.1.1: longer than the default 5 minutes); wait up to 20.
          ALEPH_SITE_GATEWAY_WAIT_ATTEMPTS: '120'
          ALEPH_SITE_GATEWAY_WAIT_DELAY_MS: '10000'
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: node --input-type=module -e "import('$RUNNER_TEMP/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"

      - name: Summary
        if: always()
        env:
          CID: ${{ inputs.ipfs_cid || steps.publish.outputs.ipfs_cid }}
          ITEM_HASH: ${{ inputs.item_hash || steps.publish.outputs.item_hash }}
          OUTCOME: ${{ job.status }}
        run: |
          echo "CID: ${CID:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "STORE item hash: ${ITEM_HASH:-none}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != success ] && [ -n "$ITEM_HASH" ] && [ -n "$CID" ]; then
            echo "The upload is on Aleph. To link it later without uploading again, run this workflow by hand with item_hash \`$ITEM_HASH\` and ipfs_cid \`$CID\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Uploaded through: ${{ steps.publish.outputs.aleph_api_host }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = success ] && [ "${{ github.event_name == 'release' || inputs.link_domain || inputs.item_hash != '' }}" = true ]; then echo "**Live:** https://${SITE_DOMAIN}" >> "$GITHUB_STEP_SUMMARY"; fi

      # Through the API: the Aleph runner has no gh.
      - name: Note the CID on the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_URL: ${{ github.event.release.url }}
          CID: ${{ steps.publish.outputs.ipfs_cid }}
        run: |
          body="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$RELEASE_URL" | jq -r '.body // ""')"
          note="$(printf '%s\n\n**On IPFS:** `%s`\n\nhttps://%s\n' "$body" "$CID" "$SITE_DOMAIN")"
          jq -n --arg body "$note" '{body: $body}' | curl -fsS -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" "$RELEASE_URL" -d @- > /dev/null
