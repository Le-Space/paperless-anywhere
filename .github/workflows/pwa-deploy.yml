name: PWA deploy

# The PWA goes to paperless.le-space.de the way Belege goes to
# belege.le-space.de: tested, built, published to Aleph IPFS, and the domain
# pointed at that CID. Only a published release (or a dispatch with
# link_domain) moves the domain; a dispatch without it publishes for a look.
# The site holds no secret: keys come from the passkey in the browser.
#
# One job on an Aleph runner (the repository is private, hosted minutes are
# billed): start one before a release with
# `pnpm relay-button gh-runner up --repo Le-Space/paperless-anywhere --count 1`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      link_domain:
        description: Point paperless.le-space.de at this build (off for a test publish)
        type: boolean
        default: false
      runner:
        description: Where the job runs ("aleph" needs a runner started with relay-button's gh-runner up)
        type: choice
        options: [aleph, ubuntu-24.04]
        default: aleph

permissions:
  contents: write # the CID goes onto the release

concurrency:
  group: pwa-deploy
  cancel-in-progress: false

env:
  SITE_DOMAIN: paperless.le-space.de

jobs:
  deploy:
    runs-on: ${{ (github.event_name == 'release' || inputs.runner == 'aleph') && fromJSON('["self-hosted","aleph"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Unit tests, build, browser tests (mocked Aleph)
        working-directory: pwa
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium > /dev/null
          pnpm exec playwright test --reporter=line

      - name: Install isolated Aleph deploy tooling
        run: npm install --prefix "$RUNNER_TEMP/le-space-deployer" @le-space/node@0.9.9

      - name: Publish to Aleph IPFS
        id: publish
        env:
          ALEPH_VM_MODE: site-publish
          ALEPH_SITE_DIRECTORY: ${{ github.workspace }}/pwa/build
          ALEPH_SITE_PIN: 'true'
          ALEPH_SITE_NAME: paperless-anywhere
          ALEPH_SITE_RETENTION_KEEP_COUNT: '3'
          ALEPH_SITE_CHANNEL: ALEPH-CLOUDSOLUTIONS
          ALEPH_SITE_ALEPH_MESSAGE_WAIT_ATTEMPTS: '240'
          ALEPH_SITE_ALEPH_MESSAGE_WAIT_DELAY_MS: '5000'
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: |
          for attempt in 1 2 3; do
            if node --input-type=module -e "import('$RUNNER_TEMP/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())" 2> >(tee "$RUNNER_TEMP/publish-err.txt" >&2); then
              exit 0
            fi
            if grep -q 'stayed pending after the wait window' "$RUNNER_TEMP/publish-err.txt"; then
              echo "::error::Aleph did not process the STORE within 20 minutes. The files are on IPFS; run this workflow again later instead of re-uploading now."
              exit 1
            fi
            echo "::warning::publish attempt $attempt failed, retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Link the custom domain
        if: github.event_name == 'release' || inputs.link_domain
        env:
          ALEPH_VM_MODE: site-domain-link
          ALEPH_SITE_ITEM_HASH: ${{ steps.publish.outputs.item_hash }}
          ALEPH_SITE_IPFS_CID: ${{ steps.publish.outputs.ipfs_cid }}
          ALEPH_SITE_DOMAIN: ${{ env.SITE_DOMAIN }}
          ALEPH_SITE_DOMAIN_CATCH_ALL_PATH: /200.html
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: node --input-type=module -e "import('$RUNNER_TEMP/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"

      - name: Summary
        run: |
          echo "CID: ${{ steps.publish.outputs.ipfs_cid }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name == 'release' || inputs.link_domain }}" = true ]; then echo "**Live:** https://${SITE_DOMAIN}" >> "$GITHUB_STEP_SUMMARY"; fi

      # Through the API: the Aleph runner has no gh.
      - name: Note the CID on the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_URL: ${{ github.event.release.url }}
          CID: ${{ steps.publish.outputs.ipfs_cid }}
        run: |
          body="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$RELEASE_URL" | jq -r '.body // ""')"
          note="$(printf '%s\n\n**On IPFS:** `%s`\n\nhttps://%s\n' "$body" "$CID" "$SITE_DOMAIN")"
          jq -n --arg body "$note" '{body: $body}' | curl -fsS -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" "$RELEASE_URL" -d @- > /dev/null
