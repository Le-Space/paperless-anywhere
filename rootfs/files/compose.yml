# Paperless-ngx and its helpers, as in upstream's docker-compose.postgres-tika.yml,
# on the host network: the confidential guest kernel has no bridge and no
# nftables, so Docker runs without networking of its own. There is no
# firewall either, and the guest has a public IPv6 address, so every service
# binds to 127.0.0.1. Only sshd (22), Caddy (443) and Aleph's attestation
# agent (8443, in the measured init) face the network;
# paperless-anywhere-check fails if anything else does.
# The images are one-layer copies of the upstream ones, pinned by digest:
# Docker's vfs driver in the confidential guest keeps every layer as a full
# copy (the upstream five took about 36 GiB), one layer once.
name: paperless

x-host: &host
  network_mode: host
  restart: unless-stopped

services:
  postgres:
    <<: *host
    # docker.io/library/postgres:18, flattened to one layer (rootfs/images.txt, flat-images.yml)
    image: ghcr.io/le-space/paperless-anywhere/postgres@sha256:22a3cebb463a0b26440acf955e675162a06af08d63ac6b0534ffef63e725a989
    env_file: /etc/paperless-anywhere/postgres.env
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - /srv/paperless/pg:/var/lib/postgresql

  valkey:
    <<: *host
    # docker.io/valkey/valkey:9-alpine, flattened to one layer (rootfs/images.txt, flat-images.yml)
    image: ghcr.io/le-space/paperless-anywhere/valkey@sha256:9b6765ede311e2bec2959bae9fed2be242807412e2a842a8c5f62b6c371abcfd
    command: ["valkey-server", "--bind", "127.0.0.1", "--protected-mode", "yes"]
    volumes:
      - /srv/paperless/valkey:/data

  gotenberg:
    <<: *host
    # docker.io/gotenberg/gotenberg:8.37, flattened to one layer (rootfs/images.txt, flat-images.yml)
    image: ghcr.io/le-space/paperless-anywhere/gotenberg@sha256:1fbc4a31a8b97be4380876bf9d158f07d19bc311d9b17381ff3a86be7e5ccf01
    command:
      - gotenberg
      - --api-bind-ip=127.0.0.1
      - --api-port=3000
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*

  tika:
    <<: *host
    # docker.io/apache/tika:3.3.1.0, flattened to one layer (rootfs/images.txt, flat-images.yml)
    image: ghcr.io/le-space/paperless-anywhere/tika@sha256:612db369c79a9aeebe2e94fceb9efa0019730fab0088d5e25824631e60c651b3
    # The image's entrypoint passes `-h 0.0.0.0` before any arguments, and
    # the first -h wins, so the same java call is spelled out here. The jar
    # matches the tag (the image sets TIKA_VERSION=3.3.1).
    entrypoint:
      - java
      - -cp
      - /tika-server-standard-3.3.1.jar:/tika-extras/*
      - org.apache.tika.server.core.TikaServerCli
      - -h
      - 127.0.0.1
      - -p
      - "9998"

  paperless:
    <<: *host
    # ghcr.io/paperless-ngx/paperless-ngx:3.2.1, flattened to one layer (rootfs/images.txt, flat-images.yml)
    image: ghcr.io/le-space/paperless-anywhere/paperless@sha256:c0d043e56538a4089661ed1137f018e85792ea5fa783b1ca8d73690a5e4ebe98
    # Not on Gotenberg and Tika: they convert office files and mails, and
    # paperless-stack-up starts them after Paperless (their images are the
    # larger half of the download at a start).
    depends_on: [postgres, valkey]
    # The image's healthcheck runs through `docker exec`, which does not work
    # in the confidential guest, so it would report "unhealthy" forever.
    # paperless-anywhere-check and the trial probe the web server instead.
    healthcheck:
      disable: true
    env_file: /etc/paperless-anywhere/paperless.env
    environment:
      PAPERLESS_REDIS: redis://127.0.0.1:6379
      PAPERLESS_DBHOST: 127.0.0.1
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_ENDPOINT: http://127.0.0.1:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://127.0.0.1:3000
      PAPERLESS_BIND_ADDR: 127.0.0.1
      PAPERLESS_PORT: "8000"
      # As on the Mac: the books hold German, English, Russian, Spanish and
      # Turkish documents. The image brings deu, eng and spa; rus and tur are
      # installed when the container starts (PAPERLESS_OCR_LANGUAGES).
      PAPERLESS_OCR_LANGUAGE: deu+eng+rus+spa+tur
      PAPERLESS_OCR_LANGUAGES: rus tur
      PAPERLESS_TIME_ZONE: Europe/Berlin
      # As on the Mac: a file whose hash is already in Paperless is not taken
      # again. Since 3.0 Paperless takes duplicates unless this is set, and
      # several mail rules matching one mail imported it 2-3 times (2026-11-04).
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
    volumes:
      - /srv/paperless/data:/usr/src/paperless/data
      - /srv/paperless/media:/usr/src/paperless/media
      - /srv/paperless/consume:/usr/src/paperless/consume
      - /srv/paperless/export:/usr/src/paperless/export
